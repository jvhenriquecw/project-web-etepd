{% extends 'base.html' %}

{% block conteudo %}
<h2>Nova Sugestão</h2>

<form method="POST">
    <div class="form-group">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Bebedouro no bloco B" required>
    </div>

    <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
            <option value="Infraestrutura">Infraestrutura</option>
            <option value="Pedagógico">Pedagógico</option>
            <option value="Alimentação">Alimentação</option>
            <option value="Outros">Outros</option>
        </select>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição detalhada</label>
        <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva sua proposta com detalhes..." required></textarea>
    </div>

    <div class="btn-actions">
        <button type="submit" class="btn btn-primary">Registrar Sugestão</button>
        <a href="{{ url_for('listar_sugestoes') }}" class="btn btn-secondary">Voltar</a>
    </div>
</form>
{% endblock %}
