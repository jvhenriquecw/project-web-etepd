{% extends 'base.html' %}

{% block conteudo %}
<h2>Responder Sugestão #{{ sugestao.id }}</h2>
<p><strong>Sugestão:</strong> {{ sugestao.titulo }}</p>
<p><strong>Descrição original:</strong> {{ sugestao.descricao }}</p>

<hr>

<form method="POST">
    <div class="form-group">
        <label for="situacao">Definir Nova Situação:</label>
        <select id="situacao" name="situacao">
            <option value="Pendente" {% if sugestao.situacao == 'Pendente' %}selected{% endif %}>Pendente</option>
            <option value="Em Análise" {% if sugestao.situacao == 'Em Análise' %}selected{% endif %}>Em Análise</option>
            <option value="Aprovada" {% if sugestao.situacao == 'Aprovada' %}selected{% endif %}>Aprovada</option>
            <option value="Recusada" {% if sugestao.situacao == 'Recusada' %}selected{% endif %}>Recusada</option>
            <option value="Concluída" {% if sugestao.situacao == 'Concluída' %}selected{% endif %}>Concluída</option>
        </select>
    </div>

    <div class="form-group">
        <label for="resposta">Resposta Oficial:</label>
        <textarea id="resposta" name="resposta" rows="5" placeholder="Redija o posicionamento oficial da coordenação..." required>{{ sugestao.resposta or '' }}</textarea>
    </div>

    <div class="btn-actions">
        <button type="submit" class="btn btn-primary">Salvar Parecer</button>
        <a href="{{ url_for('detalhes_sugestao', id_sugestao=sugestao.id) }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
